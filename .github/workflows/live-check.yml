# Prueft die AUSGELIEFERTE Site, taeglich und nach jedem Deploy-Anlass.
#
# WARUM DAS DER WICHTIGERE VON BEIDEN WORKFLOWS IST: Das Routing dieser Site
# steht nicht vollstaendig im Repo. Eine Rewrite-Regel im Cloudflare-Dashboard
# laeuft am Edge vor `_redirects` und kann jede Zeile darin ueberstimmen. Aendert
# sie sich, bleibt lokal alles gruen und live faellt etwas aus. Genau so lag die
# ArchFlow-Karte auf 404, waehrend `_redirects` sich richtig las.
name: Live-Check

on:
  schedule:
    - cron: '0 6 * * *'      # taeglich 06:00 UTC (07:00 bzw. 08:00 in DE)
  push:
    branches: [main]
    paths:                    # nur, wenn sich am Routing oder am Bestand etwas aendert
      - '_redirects'
      - '_headers'
      - 'sitemap.xml'
      - 'config/version.json'
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Nach einem Push erst dem Cloudflare-Deploy Zeit geben. Ohne das misst der
      # Lauf die VORIGE Fassung und meldet Fehler, die schon behoben sind.
      - name: Auf den Deploy warten
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Warte auf Cloudflare Pages Deploy..."
          for i in {1..30}; do
            # Pruefung ueber Check-Runs (Cloudflare Pages nutzt die GitHub Apps API)
            CONCLUSION=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs --jq '.check_runs[]? | select(.name == "Cloudflare Pages") | .conclusion' || echo "")
            
            if [ "$CONCLUSION" = "success" ]; then
              echo "Deploy abgeschlossen!"
              exit 0
            elif [ "$CONCLUSION" = "failure" ] || [ "$CONCLUSION" = "cancelled" ] || [ "$CONCLUSION" = "timed_out" ]; then
              echo "Deploy fehlgeschlagen ($CONCLUSION)!"
              exit 1
            fi
            
            # Fallback auf Commit Statuses (falls es als klassischer Status gemeldet wird)
            STATE=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/status --jq '.statuses[]? | select(.context == "Cloudflare Pages") | .state' || echo "")
            
            if [ "$STATE" = "success" ]; then
              echo "Deploy abgeschlossen (Status)!"
              exit 0
            elif [ "$STATE" = "error" ] || [ "$STATE" = "failure" ]; then
              echo "Deploy fehlgeschlagen ($STATE)!"
              exit 1
            fi
            
            echo "Noch nicht fertig... warte 10s (Versuch $i/30)"
            sleep 10
          done
          echo "Timeout nach 5 Minuten."
          exit 1

      - name: Sitemap, Dateien und Weiterleitungen pruefen
        run: node tools/live-check.mjs https://myworklog.de
