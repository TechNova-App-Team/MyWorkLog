# Prueft jeden Push und jeden PR.
#
# WARUM: Die Abnahme lief bisher nur im lokalen Pre-Commit-Hook. Der greift nicht
# bei `git commit --no-verify`, nicht bei einem Commit ueber die GitHub-Oberflaeche
# und nicht, wenn ein zweiter Agent im Arbeitsbaum committet. Cloudflare Pages
# deployt, was ankommt — ohne einen einzigen Test zu fahren.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Ein neuer Push macht den laufenden Durchgang ueberfluessig.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Baut index.html aus index.template.html + components/**. Schlaegt fehl,
      # wenn ein Fragment fehlt oder der Include-Name nicht stimmt.
      # `--check` waere hier sinnlos: index.html ist gitignored, in einem frischen
      # Clone gibt es sie nicht, und der Vergleich liefe gegen null.
      - name: index.html bauen
        run: npm run build:index

      # Die englischen Seiten. `0 fehlend` ist Pflicht — bleibt ein Schluessel
      # uebrig, fuellt merge-dict ihn still mit Deutsch auf.
      - name: /en/ bauen und auf fehlende Uebersetzungen pruefen
        run: |
          npm run i18n:build 2>&1 | tee i18n.log
          if grep -qE '[1-9][0-9]* fehlend' i18n.log; then
            echo "::error::i18n meldet fehlende Uebersetzungen"
            grep -E '[1-9][0-9]* fehlend' i18n.log
            exit 1
          fi

      # Alle Tests aus tools/, inklusive asset-pfade (jeder JS/CSS-Verweis muss
      # eine Datei treffen und absolut sein).
      #
      # Bewusst ueber run-tests.mjs statt einer Shell-Schleife: die Schleife hier
      # wertete jeden Exit != 0 als Fehlschlag und liess damit umfrage-worker
      # durchfallen, der auf dem Runner mit Exit 2 = "uebersprungen" aussteigt
      # (seine Quelle workers/ ist gitignored). run-tests.mjs kennt den
      # Unterschied, laeuft trotz Fehlschlag bis zum Ende durch und zeigt so ALLE
      # kaputten Tests in einem Durchgang, nicht nur den ersten.
      - name: Projekt-Tests
        run: npm run test:all
