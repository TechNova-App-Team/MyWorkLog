<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 – Seite nicht gefunden | MyWorkLog</title>
    <meta name="robots" content="noindex,follow">
    <!-- Bewusst NEUTRAL: diese Seite traegt kein Markenlila und kein Theme-Sync.
         Sie ist der einzige Zustand der Site, in dem es nichts anzuzeigen gibt —
         Graustufen, Weiss nur dort, wo eine Handlung angeboten wird. -->
    <meta name="theme-color" content="#0a0a0a">
    <link rel="icon" type="image/jpeg" href="/Grafiken/image.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        button, input, select, textarea { font-family: inherit; }

        :root {
            /* Neutrale Graustufen — kein Blaustich, kein Akzentton.
               --accent ist reines Weiss und bleibt Handlungen vorbehalten. */
            --bg:      #0a0a0a;
            --text:    #fafafa;
            --muted:   rgba(250,250,250,.46);
            --faint:   rgba(250,250,250,.24);
            --border:  rgba(255,255,255,.08);
            --card:    rgba(255,255,255,.04);
            --accent:  #ffffff;
            --nh:      58px;
            --bh:      42px;
        }

        html, body {
            height: 100%; overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: 'Hanken Grotesk', sans-serif;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
            border-radius: 6px;
        }

        /* ── GRAIN ────────────────────────────────────────────────────── */
        .grain {
            position: fixed; inset: -50%; z-index: 998;
            width: 200%; height: 200%;
            pointer-events: none; opacity: .04;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.72' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-size: 180px 180px;
            animation: grainMove .35s steps(1) infinite;
        }
        @keyframes grainMove {
            0%  { transform: translate(0,0) }
            15% { transform: translate(-2%,-3%) }
            30% { transform: translate(3%,1%) }
            45% { transform: translate(-1%,4%) }
            60% { transform: translate(4%,-2%) }
            75% { transform: translate(-3%,2%) }
            90% { transform: translate(2%,-4%) }
        }

        /* ── BACKGROUND ───────────────────────────────────────────────── */
        .bg {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background:
                radial-gradient(ellipse 55% 50% at 10% 5%,  rgba(255,255,255,.055) 0%, transparent 60%),
                radial-gradient(ellipse 40% 50% at 90% 95%, rgba(255,255,255,.028) 0%, transparent 55%);
        }

        /* ── MOUSE SPOTLIGHT ──────────────────────────────────────────── */
        #mspot {
            position: fixed; z-index: 1; pointer-events: none;
            width: 750px; height: 750px; border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,.045) 0%, transparent 65%);
            transform: translate(-50%,-50%);
            transition: left .5s ease-out, top .5s ease-out;
            will-change: left, top;
        }

        /* ── NAV ──────────────────────────────────────────────────────── */
        nav {
            position: fixed; inset: 0 0 auto 0;
            height: var(--nh); z-index: 100;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 28px;
            border-bottom: 1px solid var(--border);
            background: rgba(10,10,10,.82);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            animation: navIn .55s cubic-bezier(.16,1,.3,1) both;
        }
        @keyframes navIn {
            from { opacity: 0; transform: translateY(-10px); }
            to   { opacity: 1; transform: none; }
        }
        .logo {
            display: flex; align-items: center; gap: 9px;
            font-family: 'Bricolage Grotesque', sans-serif;
            font-size: .92rem; font-weight: 700;
            color: var(--text); text-decoration: none; letter-spacing: -.02em;
        }
        /* Weisser Akzent 1/3: die Marke. Kein Verlauf, kein Leuchten. */
        .logo-mark {
            width: 25px; height: 25px; border-radius: 7px;
            background: var(--accent);
            display: grid; place-items: center;
            font-size: .65rem; font-weight: 800; color: var(--bg);
            font-family: 'Bricolage Grotesque', sans-serif;
        }
        .nav-back {
            display: inline-flex; align-items: center; gap: 5px;
            font-size: .8rem; font-weight: 500; color: var(--muted);
            text-decoration: none; padding: 5px 12px; border-radius: 8px;
            border: 1px solid transparent;
            transition: color .16s, background .16s, border-color .16s;
        }
        .nav-back:hover {
            color: var(--text); background: var(--card); border-color: var(--border);
        }

        /* ── SPLIT LAYOUT ─────────────────────────────────────────────── */
        .split {
            position: fixed;
            top: var(--nh); left: 0; right: 0; bottom: var(--bh);
            display: grid;
            grid-template-columns: 44fr 56fr;
            z-index: 10;
        }

        /* ── LEFT: BIG 404 ────────────────────────────────────────────── */
        .side-l {
            position: relative; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            will-change: transform;
        }
        /* refined divider — fades at edges */
        .side-l::after {
            content: '';
            position: absolute; right: 0; top: 0; bottom: 0; width: 1px;
            background: linear-gradient(
                to bottom,
                transparent 0%,
                rgba(255,255,255,.09) 18%,
                rgba(255,255,255,.09) 82%,
                transparent 100%
            );
            pointer-events: none;
        }

        /* Die Ziffern sind Grund, nicht Akzent: mittleres Grau, das nach unten
           wegblendet. Das hellste Element der Seite bleibt der Knopf. */
        .n404 {
            font-family: 'Bricolage Grotesque', sans-serif;
            font-weight: 800;
            font-size: clamp(9rem, 21vw, 20rem);
            line-height: .88;
            letter-spacing: -.04em;
            user-select: none;
            background: linear-gradient(175deg, rgba(255,255,255,.52) 0%, rgba(255,255,255,.13) 100%);
            -webkit-background-clip: text; background-clip: text; color: transparent;
            animation: wipeIn .9s .15s cubic-bezier(.77,0,.18,1) both;
            will-change: transform;
        }
        @keyframes wipeIn {
            from { clip-path: inset(0 100% 0 0); opacity: .5; }
            to   { clip-path: inset(0 0%   0 0); opacity: 1; }
        }
        .side-l:hover .n404 {
            background: linear-gradient(175deg, rgba(255,255,255,.82) 0%, rgba(255,255,255,.22) 100%);
            -webkit-background-clip: text; background-clip: text;
            transition: background .4s;
        }

        /* ── RIGHT: CONTENT ───────────────────────────────────────────── */
        .side-r {
            display: flex; flex-direction: column;
            justify-content: center;
            padding: 0 clamp(2.5rem, 6vw, 5.5rem);
            will-change: transform;
        }

        .label {
            display: inline-flex; align-items: center; gap: 8px;
            font-size: .7rem; font-weight: 600; letter-spacing: .18em;
            text-transform: uppercase; color: var(--faint);
            margin-bottom: 1.5rem;
            animation: slideR .65s .52s cubic-bezier(.16,1,.3,1) both;
        }
        .label-line {
            display: block; width: 22px; height: 1px;
            background: var(--faint);
        }

        h1 {
            font-family: 'Bricolage Grotesque', sans-serif;
            font-weight: 700;
            font-size: clamp(1.85rem, 3.2vw, 2.85rem);
            letter-spacing: -.03em; line-height: 1.09;
            color: var(--text); margin-bottom: 1rem;
            animation: slideR .65s .6s cubic-bezier(.16,1,.3,1) both;
        }

        .desc {
            font-size: .95rem; font-weight: 400; line-height: 1.75;
            color: var(--muted); max-width: 340px; margin-bottom: 2.2rem;
            animation: slideR .65s .67s cubic-bezier(.16,1,.3,1) both;
        }

        @keyframes slideR {
            from { opacity: 0; transform: translateX(16px); }
            to   { opacity: 1; transform: none; }
        }

        .actions {
            display: flex; gap: .55rem; flex-wrap: wrap;
            animation: slideR .65s .74s cubic-bezier(.16,1,.3,1) both;
        }

        .btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: .6rem 1.25rem; border-radius: 8px;
            font-family: 'Hanken Grotesk', sans-serif;
            font-size: .84rem; font-weight: 600;
            text-decoration: none; border: 1px solid transparent;
            transition: background .18s cubic-bezier(.16,1,.3,1),
                        color .18s cubic-bezier(.16,1,.3,1),
                        border-color .18s cubic-bezier(.16,1,.3,1),
                        box-shadow .18s cubic-bezier(.16,1,.3,1),
                        transform .12s ease;
            position: relative; overflow: hidden; cursor: pointer;
        }
        /* Weisser Akzent 2/3: die eine Handlung, die zaehlt. Umkehr des
           App-Knopfs — dort farbige Flaeche auf Dunkel, hier Weiss auf Schwarz. */
        .btn-p {
            background: var(--accent); color: var(--bg);
            box-shadow: 0 4px 18px rgba(0,0,0,.55);
        }
        .btn-p::before {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(110deg, transparent 25%, rgba(0,0,0,.07) 50%, transparent 75%);
            transform: translateX(-110%);
            transition: transform .45s ease;
        }
        .btn-p:hover::before { transform: translateX(110%); }
        .btn-p:hover {
            background: #e8e8e8;
            box-shadow: 0 6px 26px rgba(0,0,0,.7);
        }
        .btn-o {
            background: transparent; color: var(--muted); border-color: var(--border);
        }
        .btn-o:hover {
            background: var(--card); color: var(--text);
            border-color: rgba(255,255,255,.16);
        }
        /* Bewegung erst beim Druecken, nicht beim Hover. */
        .btn:active { transform: scale(.985); }

        /* ── BOTTOM BAR ───────────────────────────────────────────────── */
        .botbar {
            position: fixed; inset: auto 0 0 0;
            height: var(--bh); z-index: 100;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 24px;
            border-top: 1px solid var(--border);
            background: rgba(10,10,10,.82);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            font-size: .7rem; color: var(--faint);
            animation: botIn .55s .1s cubic-bezier(.16,1,.3,1) both;
        }
        @keyframes botIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: none; }
        }
        .botbar-mid {
            position: absolute; left: 50%; transform: translateX(-50%);
            letter-spacing: .14em;
        }
        /* Links steht die einzige Angabe, die hier nachweislich stimmt:
           der Pfad, den der Besucher wirklich angefordert hat. */
        .req { display: flex; align-items: center; gap: 8px; min-width: 0; }
        .req-key { color: var(--faint); letter-spacing: .1em; text-transform: uppercase; }
        #pathEl {
            color: var(--muted);
            max-width: 300px; overflow: hidden;
            text-overflow: ellipsis; white-space: nowrap;
        }
        .botbar-r { letter-spacing: .12em; }

        /* ── MOBILE ───────────────────────────────────────────────────── */
        @media (max-width: 680px) {
            .split {
                grid-template-columns: 1fr;
                grid-template-rows: minmax(0, auto) 1fr;
            }
            .side-l {
                padding: 1.5rem 1.5rem 0;
                border-bottom: 1px solid var(--border);
                min-height: 0;
            }
            .side-l::after { display: none; }
            .n404 { font-size: clamp(5.5rem, 28vw, 9rem); padding-bottom: 1.5rem; }
            /* Auf kurzen Viewports darf der rechte Block scrollen — sonst
               schneidet das fixe Raster die Knoepfe unten ab. */
            .side-r {
                padding: 1.8rem 1.5rem; justify-content: flex-start;
                overflow-y: auto; -webkit-overflow-scrolling: touch;
            }
            h1 { font-size: 1.8rem; }
            nav { padding: 0 18px; }
            .botbar { padding: 0 14px; }
            .botbar-mid { display: none; }
            .actions { flex-direction: column; }
            .btn { justify-content: center; }
        }

        /* ── TOUCH ────────────────────────────────────────────────────── */
        @media (hover: none) {
            .n404 { background: linear-gradient(175deg, rgba(255,255,255,.6) 0%, rgba(255,255,255,.16) 100%); }
        }

        /* ── REDUCED MOTION ───────────────────────────────────────────── */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
            }
            .grain { animation: none; }
            #mspot { display: none; }
        }
    </style>
</head>
<body>

<div class="grain"></div>
<div class="bg"></div>
<div id="mspot"></div>

<nav>
    <a href="/" class="logo" id="logoLink">
        <div class="logo-mark">M</div>
        MyWorkLog
    </a>
    <a href="/" class="nav-back" id="navBack">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        <span id="txtHome">Startseite</span>
    </a>
</nav>

<main class="split">
    <div class="side-l" id="sl">
        <div class="n404" aria-label="404">404</div>
    </div>

    <div class="side-r" id="sr">
        <div class="label">
            <span class="label-line"></span>
            <span id="txtLabel">Fehler 404</span>
        </div>
        <h1 id="txtH1">Diese Seite<br>existiert nicht.</h1>
        <p class="desc" id="txtDesc">
            Die angeforderte URL wurde nicht gefunden oder entfernt.
            Deine Zeiteinträge sind davon nicht betroffen.
        </p>
        <div class="actions">
            <a href="/" class="btn btn-p" id="btnApp">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                <span id="txtApp">Zur App</span>
            </a>
            <a href="javascript:history.back()" class="btn btn-o">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                <span id="txtBack">Zurück</span>
            </a>
        </div>
    </div>
</main>

<footer class="botbar">
    <span class="req">
        <span class="req-key" id="txtReq">Angefragt</span>
        <span id="pathEl"></span>
    </span>
    <span class="botbar-mid">MYWORKLOG · 404</span>
    <span class="botbar-r">NOT FOUND</span>
</footer>

<script>
    // ── Sprache ──────────────────────────────────────────────────────────
    // Cloudflare Pages liefert diese EINE Datei fuer jeden nicht gefundenen
    // Pfad aus — auch fuer /en/*. Eine eigene EN-URL kann es also nicht geben;
    // die Texte werden hier am Pfad umgeschaltet. Die Seite laeuft NICHT durch
    // die i18n-Pipeline (tools/i18n kennt nur pages/), deshalb stehen die
    // englischen Strings bewusst hier.
    const path = window.location.pathname;
    if (/^\/en(\/|$)/.test(path)) {
        document.documentElement.lang = 'en';
        document.title = '404 – Page not found | MyWorkLog';
        const t = {
            txtHome:  'Home',
            txtLabel: 'Error 404',
            txtDesc:  'The requested URL was not found or has been removed. Your time entries are unaffected.',
            txtApp:   'Open the app',
            txtBack:  'Go back',
            txtReq:   'Requested'
        };
        for (const id in t) document.getElementById(id).textContent = t[id];
        document.getElementById('txtH1').innerHTML = 'This page<br>does not exist.';
        document.getElementById('logoLink').href = '/en/';
        document.getElementById('navBack').href  = '/en/';
        document.getElementById('btnApp').href   = '/en/';
    }

    // ── Angefragter Pfad ─────────────────────────────────────────────────
    document.getElementById('pathEl').textContent = path.length > 42 ? path.slice(0, 40) + '…' : path;

    // ── Zeiger-Effekte (nur wenn Bewegung erwuenscht ist) ────────────────
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!reduce) {
        const mspot = document.getElementById('mspot');
        const sl = document.getElementById('sl');
        const sr = document.getElementById('sr');
        let tx = 0, ty = 0, lx = 0, ly = 0;

        document.addEventListener('mousemove', e => {
            mspot.style.left = e.clientX + 'px';
            mspot.style.top  = e.clientY + 'px';
            tx = (e.clientX / innerWidth  - .5) * innerWidth;
            ty = (e.clientY / innerHeight - .5) * innerHeight;
        });

        (function raf() {
            lx += (tx - lx) * .065;
            ly += (ty - ly) * .065;
            sl.style.transform = 'translate(' + (lx * .042).toFixed(2) + 'px, ' + (ly * .028).toFixed(2) + 'px)';
            sr.style.transform = 'translate(' + (lx * -.022).toFixed(2) + 'px, ' + (ly * -.015).toFixed(2) + 'px)';
            requestAnimationFrame(raf);
        })();
    }
</script>
</body>
</html>
