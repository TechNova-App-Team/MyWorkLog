<!-- CSS Styling for Icon System -->
<style>
  .nav-icon-svg {
    width: 20px;
    height: 20px;
    display: inline-block;
    flex-shrink: 0;
    color: currentColor;
    stroke: currentColor;
    vertical-align: middle;
    transition: all 0.25s ease;
  }

  /* Hover effect */
  .nav-item:hover .nav-icon-svg {
    filter: brightness(1.15);
    stroke-width: 2.7;
  }

  /* Active state */
  .nav-item.active .nav-icon-svg {
    filter: brightness(1.25) drop-shadow(0 0 6px rgba(148, 184, 232, 0.4));
  }

  /* Light theme support */
  [data-theme="light"] .nav-icon-svg {
    color: inherit;
  }
</style>
