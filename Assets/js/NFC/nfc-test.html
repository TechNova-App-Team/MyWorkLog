<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MyWorkLog — NFC Test</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;padding:18px;background:#0b1020;color:#e6eef8}
    h1{margin:0 0 12px}
    .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
    button{background:#1f2937;color:#fff;border:0;padding:8px 12px;border-radius:8px;cursor:pointer}
    input,select{padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.02);color:#e6eef8}
    pre{background:#071022;padding:12px;border-radius:8px;overflow:auto;max-height:300px}
    label{font-size:0.9rem}
    #qr{margin-top:12px;max-width:220px;border-radius:8px}
  </style>
</head>
<body>
  <h1>MyWorkLog — NFC Test</h1>
  <div id="status">Engine: <em>uninitialized</em></div>

  <div class="row">
    <button id="btnInit">Init Engine</button>
    <button id="btnStart">Start Scan</button>
    <button id="btnStop">Stop Scan</button>
    <button id="btnListChips">List Chips</button>
    <button id="btnShowLogs">Show Logs</button>
    <button id="btnClearLogs">Clear Logs</button>
  </div>

  <div style="margin:8px 0 16px">
    <form id="registerForm" onsubmit="return false;" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <input id="chipLabel" placeholder="Label (z.B. Büro)" value="TestChip">
      <input id="chipId" placeholder="Chip ID (optional)">
      <select id="chipAction">
        <option value="tg">Toggle (tg)</option>
        <option value="ci">Check-in (ci)</option>
        <option value="co">Check-out (co)</option>
        <option value="va">Urlaub (va)</option>
      </select>
      <button id="btnRegister">Register</button>
      <button id="btnCreateAndWrite">Create & Write</button>
    </form>
  </div>

  <div class="row">
    <input id="simulateInput" placeholder="Action or chipId (z.B. tg or nfc_123)">
    <button id="btnSimulate">Simulate Scan</button>
    <button id="btnGenerateQR">Generate QR for last chip</button>
  </div>

  <h3>Output</h3>
  <pre id="output">— ready —</pre>
  <img id="qr" src="" alt="QR" />

  <script src="nfc.js"></script>
  <script>
    function el(id){return document.getElementById(id)}
    function log(v){ el('output').textContent = typeof v === 'string' ? v : JSON.stringify(v, null, 2) }

    function updateStatus(){
      try{
        const nfc = window.MWLNfc;
        if(!nfc) return el('status').innerHTML = 'Engine: <em>not loaded</em>';
        const st = nfc.getStatus();
        el('status').innerHTML = `Engine: <strong>${st.initialized? 'initialized':'not init'}</strong> · NFC supported: <strong>${st.nfcSupported}</strong> · Scanning: <strong>${st.isScanning}</strong> · Chips: <strong>${st.chips.length}</strong>`;
      }catch(e){console.error(e)}
    }

    // Wait until MWLNfc exists (nfc.js may initialize immediately)
    function whenReady(fn){
      if(window.MWLNfc) return fn();
      const t = setInterval(()=>{ if(window.MWLNfc){ clearInterval(t); fn(); } }, 150);
    }

    whenReady(()=>{
      const nfc = window.MWLNfc;
      updateStatus();

      // Event listeners
      nfc.bus.on('router:entry_created', ev => {
        log({ event: 'entry_created', message: ev.message || ev });
        updateStatus();
      });
      nfc.bus.on('reader:scanning', () => { log('Reader: scanning...'); updateStatus(); });
      nfc.bus.on('reader:error', (d) => { log({event:'reader:error', d}); updateStatus(); });

      el('btnInit').onclick = ()=>{ try{ nfc.init(); log('Engine init called'); updateStatus(); } catch(e){ log('Init error: '+e.message);} };

      el('btnStart').onclick = async ()=>{
        try{ await nfc.startScan(); log('startScan() ok — waiting for a tag'); updateStatus(); }
        catch(e){ log('startScan error: '+(e && e.message)); }
      };

      el('btnStop').onclick = ()=>{ try{ nfc.stopScan(); log('stopScan called'); updateStatus(); }catch(e){ log('stop error:'+e.message) } };

      el('btnListChips').onclick = ()=>{ log(nfc.registry.getAll()); };
      el('btnShowLogs').onclick = ()=>{ log(nfc.logger.getAll().slice(0,200)); };
      el('btnClearLogs').onclick = ()=>{ nfc.logger.clear(); log('logs cleared'); };

      el('btnRegister').onclick = ()=>{
        const label = el('chipLabel').value || 'Test';
        const chipId = el('chipId').value || undefined;
        const action = el('chipAction').value || 'tg';
        try{
          const chip = nfc.registry.register({ id: chipId, label, action });
          log({ registered: chip }); updateStatus();
        }catch(e){ log('register error:'+e.message); }
      };

      el('btnCreateAndWrite').onclick = async ()=>{
        const label = el('chipLabel').value || 'Test';
        const chipId = el('chipId').value || undefined;
        const action = el('chipAction').value || 'tg';
        try{
          const { chip, writeResult } = await nfc.createAndWriteChip({ label, action, id: chipId });
          log({ chip, writeResult }); updateStatus();
        }catch(e){ log('write error:'+ (e && e.message)); }
      };

      el('btnSimulate').onclick = async ()=>{
        const val = el('simulateInput').value.trim();
        if(!val){ log('Enter action or chipId to simulate'); return; }
        try{
          const res = await nfc.simulateScan(val);
          log(res); updateStatus();
        }catch(e){ log('simulate error:'+e.message); }
      };

      el('btnGenerateQR').onclick = ()=>{
        const chips = nfc.registry.getAll();
        if(!chips.length){ log('No chips registered'); return; }
        const last = chips[chips.length-1];
        const url = nfc.qr.generateUrl(last.encodedUrl, 300);
        el('qr').src = url; log({ chip: last, qr: url });
      };

      // Initial status
      updateStatus();
    });

    // Safety: fallback status update
    setInterval(updateStatus, 3000);
  </script>
</body>
</html>
