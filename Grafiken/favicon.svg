<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0b1a"/>
      <stop offset="100%" stop-color="#060510"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="glassGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="outerGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="roundedClip">
      <rect width="512" height="512" rx="108"/>
    </clipPath>
  </defs>

  <!-- Dark background -->
  <rect fill="url(#bgGrad)" width="512" height="512" rx="108"/>

  <!-- Ambient orbs (matches website bg orbs) -->
  <circle cx="95"  cy="75"  r="160" fill="#a855f7" opacity="0.08" clip-path="url(#roundedClip)"/>
  <circle cx="430" cy="440" r="145" fill="#06b6d4" opacity="0.07" clip-path="url(#roundedClip)"/>

  <!-- Glass card panel -->
  <rect x="60" y="68" width="392" height="348" rx="32"
        fill="rgba(255,255,255,0.035)"
        stroke="rgba(255,255,255,0.07)" stroke-width="1.5"/>

  <!-- Outer subtle ring -->
  <circle cx="256" cy="238" r="152" fill="none"
          stroke="rgba(255,255,255,0.05)" stroke-width="2"/>

  <!-- Brand arc (purple→cyan, ~300° sweep) -->
  <circle cx="256" cy="238" r="152" fill="none"
          stroke="url(#ringGrad)" stroke-width="4.5"
          stroke-dasharray="877 79"
          stroke-dashoffset="220"
          stroke-linecap="round"
          filter="url(#outerGlow)"
          opacity="0.85"/>

  <!-- Clock face glass -->
  <circle cx="256" cy="238" r="130"
          fill="url(#glassGrad)"
          stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Major tick marks (12/3/6/9) -->
  <line x1="256" y1="114" x2="256" y2="134" stroke="rgba(255,255,255,0.55)" stroke-width="5" stroke-linecap="round"/>
  <line x1="380" y1="238" x2="360" y2="238" stroke="rgba(255,255,255,0.55)" stroke-width="5" stroke-linecap="round"/>
  <line x1="256" y1="362" x2="256" y2="342" stroke="rgba(255,255,255,0.55)" stroke-width="5" stroke-linecap="round"/>
  <line x1="132" y1="238" x2="152" y2="238" stroke="rgba(255,255,255,0.55)" stroke-width="5" stroke-linecap="round"/>

  <!-- Minor tick dots -->
  <circle cx="319" cy="124" r="3" fill="rgba(255,255,255,0.22)"/>
  <circle cx="372" cy="177" r="3" fill="rgba(255,255,255,0.22)"/>
  <circle cx="372" cy="299" r="3" fill="rgba(255,255,255,0.22)"/>
  <circle cx="319" cy="352" r="3" fill="rgba(255,255,255,0.22)"/>
  <circle cx="193" cy="352" r="3" fill="rgba(255,255,255,0.22)"/>
  <circle cx="140" cy="299" r="3" fill="rgba(255,255,255,0.22)"/>
  <circle cx="140" cy="177" r="3" fill="rgba(255,255,255,0.22)"/>
  <circle cx="193" cy="124" r="3" fill="rgba(255,255,255,0.22)"/>

  <!-- Hour hand → ~10:10 position (purple, glowing) -->
  <line x1="256" y1="238" x2="202" y2="170"
        stroke="#a855f7" stroke-width="13" stroke-linecap="round"
        filter="url(#glow)"/>

  <!-- Minute hand → ~2 o'clock (cyan, glowing) -->
  <line x1="256" y1="238" x2="322" y2="162"
        stroke="#06b6d4" stroke-width="9" stroke-linecap="round"
        filter="url(#glow)"/>

  <!-- Center cap -->
  <circle cx="256" cy="238" r="15" fill="url(#brandGrad)"/>
  <circle cx="256" cy="238" r="7"  fill="white" opacity="0.95"/>

  <!-- MW label pill -->
  <rect x="172" y="400" width="168" height="50" rx="25"
        fill="url(#brandGrad)" opacity="0.12"/>
  <rect x="172" y="400" width="168" height="50" rx="25"
        fill="none" stroke="url(#brandGrad)" stroke-width="1.5" opacity="0.45"/>
  <text x="256" y="436"
        font-family="'Segoe UI','Inter',system-ui,sans-serif"
        font-size="26" font-weight="800" letter-spacing="5"
        fill="white" text-anchor="middle" opacity="0.9">MW</text>

  <!-- Top shine edge -->
  <rect x="60" y="68" width="392" height="2" rx="1"
        fill="rgba(255,255,255,0.12)"/>
</svg>