<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0b1a"/>
      <stop offset="100%" stop-color="#060510"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="glassGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="outerGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="roundedClip">
      <rect width="192" height="192" rx="40"/>
    </clipPath>
  </defs>

  <!-- Dark background -->
  <rect fill="url(#bgGrad)" width="192" height="192" rx="40"/>

  <!-- Ambient orbs -->
  <circle cx="35"  cy="28"  r="60" fill="#a855f7" opacity="0.08" clip-path="url(#roundedClip)"/>
  <circle cx="162" cy="165" r="55" fill="#06b6d4" opacity="0.07" clip-path="url(#roundedClip)"/>

  <!-- Glass card -->
  <rect x="12" y="16" width="168" height="136" rx="16"
        fill="rgba(255,255,255,0.035)"
        stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

  <!-- Brand arc ring -->
  <circle cx="96" cy="80" r="54" fill="none"
          stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <circle cx="96" cy="80" r="54" fill="none"
          stroke="url(#ringGrad)" stroke-width="2"
          stroke-dasharray="311 28"
          stroke-dashoffset="80"
          stroke-linecap="round"
          filter="url(#outerGlow)"
          opacity="0.85"/>

  <!-- Clock face -->
  <circle cx="96" cy="80" r="46"
          fill="url(#glassGrad)"
          stroke="rgba(255,255,255,0.06)" stroke-width="0.8"/>

  <!-- Major ticks -->
  <line x1="96" y1="36" x2="96" y2="44"  stroke="rgba(255,255,255,0.55)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="140" y1="80" x2="132" y2="80" stroke="rgba(255,255,255,0.55)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="96" y1="124" x2="96" y2="116" stroke="rgba(255,255,255,0.55)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="52" y1="80" x2="60" y2="80"  stroke="rgba(255,255,255,0.55)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Hour hand (purple) -->
  <line x1="96" y1="80" x2="73" y2="55"
        stroke="#a855f7" stroke-width="5" stroke-linecap="round"
        filter="url(#glow)"/>

  <!-- Minute hand (cyan) -->
  <line x1="96" y1="80" x2="120" y2="54"
        stroke="#06b6d4" stroke-width="3.5" stroke-linecap="round"
        filter="url(#glow)"/>

  <!-- Center cap -->
  <circle cx="96" cy="80" r="6" fill="url(#brandGrad)"/>
  <circle cx="96" cy="80" r="2.8" fill="white" opacity="0.95"/>

  <!-- MW pill -->
  <rect x="56" y="148" width="80" height="30" rx="15"
        fill="url(#brandGrad)" opacity="0.12"/>
  <rect x="56" y="148" width="80" height="30" rx="15"
        fill="none" stroke="url(#brandGrad)" stroke-width="1" opacity="0.45"/>
  <text x="96" y="169"
        font-family="'Segoe UI','Inter',system-ui,sans-serif"
        font-size="13" font-weight="800" letter-spacing="3"
        fill="white" text-anchor="middle" opacity="0.9">MW</text>

  <!-- Shine edge -->
  <rect x="12" y="16" width="168" height="1.2" rx="0.6"
        fill="rgba(255,255,255,0.12)"/>
</svg>