<div id="view-goals" class="view-section">

            <!-- Bis v8.0.5 stand hier ein fest eingebauter Erfolg („Marathon-Start,
                 50h erreicht"), der bei jedem Nutzer freigeschaltet war, dazu
                 Balken mit erfundenen Nennern (/1500 h) und 40 h / 5 Tage als
                 Wochensoll. Alles hier drunter rechnet goals.js aus den Daten;
                 nichts im Markup behauptet einen Stand. -->
            <div class="view-header">
                <div>
                    <h2 class="view-title">Ziele</h2>
                    <p class="view-subtitle" id="glSubtitle"></p>
                </div>
                <div class="view-header-actions">
                    <button type="button" class="gl-btn gl-btn--primary" id="glNewBtn" onclick="glOpenComposer()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                        <span>Neues Ziel</span>
                    </button>
                </div>
            </div>

            <section class="gl-week" id="glWeek" aria-labelledby="glWeekTitle"></section>

            <section class="gl-composer" id="glComposer" hidden aria-labelledby="glComposerTitle"></section>

            <section class="gl-goals" aria-labelledby="glGoalsTitle">
                <div class="gl-section-head">
                    <h3 class="gl-section-title" id="glGoalsTitle">Deine Ziele</h3>
                </div>
                <div class="gl-grid" id="goalsList"></div>
                <div id="glDone"></div>
            </section>

            <section class="gl-miles" aria-labelledby="glMilesTitle">
                <div class="gl-section-head">
                    <h3 class="gl-section-title" id="glMilesTitle">Meilensteine</h3>
                    <p class="gl-section-note" id="glMilesNote"></p>
                </div>
                <div class="gl-miles-grid" id="trophiesList"></div>
            </section>

        </div>
