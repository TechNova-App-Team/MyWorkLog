        <div id="view-weekview" class="view-section">
            <h2 style="margin-bottom:0.5rem;">📆 Wochenansicht</h2>
            <p style="color:var(--text-muted); margin-bottom:2rem;">Detaillierte Analyse deiner Arbeitswoche – Tag für Tag. Vergleiche mit der Vorwoche und erkenne Muster.</p>

            <!-- Wochen-Navigator -->
            <div class="card" style="margin-bottom:2rem; display:flex; gap:15px; align-items:center; flex-wrap:wrap;">
                <button class="btn-ghost" onclick="weekViewNavigate(-1)" style="padding:8px 14px;">◀ Vorwoche</button>
                <div style="flex:1; text-align:center;">
                    <div id="wvWeekLabel" style="font-size:1.1rem; font-weight:700; color:var(--primary);">KW --</div>
                    <div id="wvDateRange" style="font-size:0.8rem; color:var(--text-muted);"></div>
                </div>
                <button class="btn-ghost" onclick="weekViewNavigate(1)" style="padding:8px 14px;">Nächste ▶</button>
                <button class="btn-ghost" onclick="weekViewNavigate(0)" style="padding:8px 14px; border-color:var(--primary); color:var(--primary);">⟳ Heute</button>
            </div>

            <!-- KPI Übersicht der Woche -->
            <div class="kpi-grid" style="grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); margin-bottom:2rem;" id="wvKPIGrid">
                <!-- filled by JS -->
            </div>

            <!-- Woche vs Vorwoche Vergleich -->
            <div class="card" style="margin-bottom:2rem;">
                <h3 style="font-size:1.1rem; margin-bottom:1.5rem;">📊 Wochenvergleich</h3>
                <div id="wvComparisonContent" style="display:grid; grid-template-columns:1fr auto 1fr; gap:16px; align-items:center;">
                    <!-- filled by JS -->
                </div>
            </div>

            <!-- Tagesübersicht der Woche -->
            <div class="card" style="margin-bottom:2rem;">
                <h3 style="font-size:1.1rem; margin-bottom:1.5rem;">📋 Tagesübersicht</h3>
                <div id="wvDailyBreakdown">
                    <!-- filled by JS -->
                </div>
            </div>

            <!-- Wochentags-Analyse (Balkendiagramm) -->
            <div class="card" style="margin-bottom:2rem;">
                <h3 style="font-size:1.1rem; margin-bottom:1.5rem;">📈 Stunden pro Tag</h3>
                <div id="wvDayBars" style="display:flex; gap:8px; align-items:flex-end; height:200px; padding-top:20px;">
                    <!-- filled by JS -->
                </div>
            </div>

            <!-- Wochen-Trend (letzte 8 Wochen) -->
            <div class="card">
                <h3 style="font-size:1.1rem; margin-bottom:1.5rem;">🔄 Wochen-Trend (letzte 8 Wochen)</h3>
                <div id="wvTrendChart" style="display:flex; gap:6px; align-items:flex-end; height:180px;">
                    <!-- filled by JS -->
                </div>
                <div id="wvTrendLabels" style="display:flex; gap:6px; margin-top:8px;">
                    <!-- filled by JS -->
                </div>
            </div>
        </div>
