<div id="view-weekview" class="view-section">

            <!-- ═══ Kopf: Wochenregler ═══ -->
            <header class="wv-head">
                <div class="wv-head__id">
                    <p class="wv-eyebrow">Woche</p>
                    <h2 class="wv-head__title" id="wvTitle">&mdash;</h2>
                    <p class="wv-head__sub" id="wvHeadSub">Woche wird geladen.</p>
                </div>
                <div class="wv-nav">
                    <button type="button" class="wv-nav__btn" id="wvPrev" onclick="wvNav(-1)" aria-label="Vorherige Woche"></button>
                    <button type="button" class="wv-nav__now" id="wvNow" onclick="wvNav(0)">&mdash;</button>
                    <button type="button" class="wv-nav__btn" id="wvNext" onclick="wvNav(1)" aria-label="Nächste Woche"></button>
                </div>
            </header>

            <!-- ═══ 1 · Befund ═══ -->
            <section class="wv-verdict">
                <div class="wv-verdict__lead">
                    <p class="wv-verdict__kicker">Saldo der Woche</p>
                    <p class="wv-verdict__num" id="wvSaldo">&mdash;</p>
                    <p class="wv-verdict__say" id="wvSay">&mdash;</p>
                </div>
                <dl class="wv-facts">
                    <div class="wv-fact">
                        <dt class="wv-fact__k">Geleistet</dt>
                        <dd class="wv-fact__v" id="wvWorked">&mdash;</dd>
                    </div>
                    <div class="wv-fact">
                        <dt class="wv-fact__k">Arbeitstage</dt>
                        <dd class="wv-fact__v" id="wvDays">&mdash;</dd>
                    </div>
                    <div class="wv-fact">
                        <dt class="wv-fact__k">Ø Anwesenheit</dt>
                        <dd class="wv-fact__v" id="wvWindow">&mdash;</dd>
                    </div>
                    <div class="wv-fact">
                        <dt class="wv-fact__k">Pausen</dt>
                        <dd class="wv-fact__v" id="wvBreaks">&mdash;</dd>
                    </div>
                </dl>
            </section>

            <!-- ═══ 2 · Der Tagesablauf (Signature) ═══ -->
            <section class="wv-act">
                <div class="wv-act__head">
                    <div class="wv-act__id">
                        <p class="wv-eyebrow">Ablauf</p>
                        <h3 class="wv-act__title">Wann du diese Woche da warst</h3>
                        <p class="wv-act__sub" id="wvPlanSub">&mdash;</p>
                    </div>
                    <div class="wv-key" id="wvPlanKey"></div>
                </div>
                <div class="wv-plan" id="wvPlan"></div>
            </section>

            <!-- ═══ 3 · Acht Wochen ═══ -->
            <section class="wv-act">
                <div class="wv-act__head">
                    <div class="wv-act__id">
                        <p class="wv-eyebrow">Einordnung</p>
                        <h3 class="wv-act__title">Acht Wochen um diese herum</h3>
                        <p class="wv-act__sub" id="wvTrendSub">&mdash;</p>
                    </div>
                </div>
                <div class="wv-trend" id="wvTrend"></div>
            </section>
        </div>
