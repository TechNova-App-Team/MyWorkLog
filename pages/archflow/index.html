/* Maintenance-Gate: prueft /config/maintenance.json, leitet bei active:true auf /maintenance/ um. */
(function(){if(/^\/maintenance/.test(location.pathname))return;document.documentElement.style.visibility='hidden';var r=false;function re(){if(!r){r=true;document.documentElement.style.visibility='';}}fetch('/config/maintenance.json?t='+Date.now(),{cache:'no-store'}).then(function(x){return x.ok?x.json():null;}).then(function(c){if(c && c.active===true){location.replace('/maintenance/');}else{re();}}).catch(re);setTimeout(re,1200);})();

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
:root{
  --bg0:#050507;--bg1:#09090c;--bg2:#0e0e12;--bg3:#131318;--bg4:#1a1a21;
  --border:rgba(255,255,255,0.055);--border2:rgba(255,255,255,0.10);
  --t1:#eeeef2;--t2:rgba(238,238,242,0.62);--t3:rgba(238,238,242,0.32);
  --acc:#3b82f6;--acc2:#60a5fa;--acc-bg:rgba(59,130,246,0.12);--acc-border:rgba(59,130,246,0.28);
  --font:'Outfit',sans-serif;--mono:'IBM Plex Mono',monospace;
  --ease:cubic-bezier(0.32,0.72,0,1);--ease-out:cubic-bezier(0,0,0.2,1);
}
body{font-family:var(--font);background:var(--bg0);color:var(--t1)}
#loader{position:fixed;inset:0;z-index:999;background:var(--bg0);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;transition:opacity .5s var(--ease-out),transform .5s var(--ease-out)}
#loader.out{opacity:0;transform:scale(.97);pointer-events:none}
.ld-icon{width:60px;height:60px;border-radius:16px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 0 48px rgba(59,130,246,.3);animation:ldFloat 2s ease-in-out infinite}
@keyframes ldFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.ld-text{text-align:center}
.ld-text h1{font-size:26px;font-weight:700;letter-spacing:-.4px;background:linear-gradient(135deg,#eeeef2,rgba(238,238,242,.4));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.ld-text p{font-size:12px;color:var(--t3);font-family:var(--mono);margin-top:4px}
.ld-track{width:192px;height:2px;background:var(--bg4);border-radius:2px;overflow:hidden}
.ld-bar{height:100%;width:0%;border-radius:2px;background:linear-gradient(90deg,#3b82f6,#8b5cf6);transition:width .35s var(--ease-out)}
.ld-msg{font-size:11px;color:var(--t3);font-family:var(--mono)}
#app{height:100vh;display:flex;flex-direction:column;opacity:0;transition:opacity .4s var(--ease-out)}
#app.on{opacity:1}
header{height:52px;flex-shrink:0;display:flex;align-items:center;gap:12px;padding:0 14px;background:rgba(5,5,7,.88);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border-bottom:1px solid var(--border);position:relative;z-index:50}
.h-brand{display:flex;align-items:center;gap:9px;padding-right:14px;border-right:1px solid var(--border);flex-shrink:0}
.h-logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.h-title{font-size:15px;font-weight:700;letter-spacing:-.3px}
.h-proj{font-size:10px;color:var(--t3);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.h-stats{display:flex;gap:3px}
.h-s{display:flex;align-items:center;gap:5px;padding:4px 9px;background:var(--bg2);border:1px solid var(--border);border-radius:7px}

.h-space{flex:1}
.h-btns{display:flex;gap:5px}
.hb{height:30px;padding:0 11px;background:var(--bg2);border:1px solid var(--border);color:var(--t2);border-radius:8px;font-family:var(--font);font-size:11px;font-weight:500;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:5px;white-space:nowrap}

.hb.on{background:var(--acc-bg);border-color:var(--acc-border);color:var(--acc2)}
.main{flex:1;display:flex;overflow:hidden;position:relative}
.sb{width:256px;flex-shrink:0;display:flex;flex-direction:column;background:var(--bg1);border-right:1px solid var(--border)}
.sb-srch{padding:10px;border-bottom:1px solid var(--border)}

.sb-filt{display:flex;gap:3px;padding:7px 10px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.sf{height:22px;padding:0 8px;background:transparent;border:1px solid var(--border);color:var(--t3);border-radius:5px;font-family:var(--font);font-size:10px;font-weight:500;cursor:pointer;transition:all .12s;white-space:nowrap}

.fi{display:flex;align-items:center;gap:7px;padding:4px 8px;border-radius:7px;cursor:pointer;transition:background .1s;font-family:var(--mono)}

.cv{flex:1;position:relative;overflow:hidden;background:var(--bg0)}

.zc{position:absolute;bottom:20px;right:20px;display:flex;flex-direction:column;gap:4px;z-index:10}
.zb{width:32px;height:32px;background:rgba(9,9,12,.9);border:1px solid var(--border);color:var(--t2);border-radius:9px;cursor:pointer;font-size:15px;font-family:var(--mono);display:flex;align-items:center;justify-content:center;transition:all .15s;backdrop-filter:blur(8px)}

.lr{display:flex;align-items:center;gap:7px;font-size:10px;color:var(--t3);font-family:var(--mono);margin-bottom:4px}
.lr:last-child{margin:0}
.ll{width:16px;height:2px;border-radius:2px}
.dp{width:0;flex-shrink:0;background:var(--bg1);border-left:1px solid var(--border);overflow:hidden;transition:width .3s var(--ease)}
.dp.o{width:296px}
.dp-in{width:296px;height:100%;overflow-y:auto;padding:14px}
.dp-in::-webkit-scrollbar{width:2px}
.dp-in::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:2px}
.dp-x{float:right;width:22px;height:22px;background:var(--bg3);border:1px solid var(--border);color:var(--t3);border-radius:6px;cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.dp-x:hover{color:var(--t1)}
.dp-ico{font-size:22px;margin:8px 0 5px}
.dp-name{font-size:14px;font-weight:700;word-break:break-all;line-height:1.35}
.dp-path{font-size:9px;color:var(--t3);font-family:var(--mono);margin-top:3px;word-break:break-all;line-height:1.6}
.dp-badge{display:inline-flex;align-items:center;gap:4px;margin-top:7px;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:600;border-width:1px;border-style:solid}
.dsec{margin-top:14px}
.dsec-t{font-size:8px;text-transform:uppercase;letter-spacing:1.2px;color:var(--t3);font-family:var(--mono);margin-bottom:7px;display:flex;align-items:center;gap:7px}

.chips{display:flex;flex-wrap:wrap;gap:3px}
.ch{padding:2px 7px;border-radius:5px;font-size:9px;font-family:var(--mono);background:var(--bg3);border:1px solid var(--border);color:var(--t3);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch.g{border-color:rgba(52,211,153,.2);color:#4ade80;background:rgba(52,211,153,.06)}
.ch.b{border-color:rgba(96,165,250,.2);color:#7dd3fc;background:rgba(96,165,250,.06)}
.ch.y{border-color:rgba(251,191,36,.2);color:#fcd34d;background:rgba(251,191,36,.06)}
.cr{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:8px;background:var(--bg2);margin-bottom:3px;cursor:pointer;transition:background .1s}
.cr:hover{background:var(--bg3)}
.cr-dot{width:5px;height:5px;border-radius:2px;flex-shrink:0}
.cr-n{font-size:10px;font-family:var(--mono);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--t2)}
.cr-t{font-size:8px;color:var(--t3);text-transform:uppercase;letter-spacing:.3px;flex-shrink:0}
.mob-nav{display:none;height:58px;flex-shrink:0;background:rgba(5,5,7,.96);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid var(--border);align-items:center;justify-content:space-around;padding:0 8px;padding-bottom:env(safe-area-inset-bottom,0px)}
.mt{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 22px;border-radius:12px;cursor:pointer;border:none;background:none;color:var(--t3);font-family:var(--font);transition:color .2s}
.mt.on{color:var(--acc2)}
.mt-i{font-size:20px;line-height:1}
.mt-l{font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:.4px}
.bs{display:none;position:fixed;bottom:0;left:0;right:0;z-index:200;background:var(--bg2);border-top:1px solid var(--border2);border-radius:20px 20px 0 0;transform:translateY(100%);transition:transform .35s var(--ease);max-height:78vh;flex-direction:column;box-shadow:0 -20px 60px rgba(0,0,0,.5)}
.bs.o{transform:translateY(0)}
.bs-h{display:flex;justify-content:center;padding:11px 0 7px;flex-shrink:0}
.bs-hb{width:34px;height:4px;background:var(--bg4);border-radius:4px}
.bs-body{overflow-y:auto;padding:0 16px 32px;flex:1}
.bs-body::-webkit-scrollbar{display:none}
.bk{display:none;position:fixed;inset:0;z-index:190;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.bk.o{display:block}
#tt{position:fixed;z-index:300;background:var(--bg2);border:1px solid var(--border2);border-radius:11px;padding:10px 13px;font-size:11px;pointer-events:none;display:none;max-width:220px;box-shadow:0 8px 32px rgba(0,0,0,.55)}
.tt-n{font-weight:600;font-size:13px;margin-bottom:1px}
.tt-p{font-family:var(--mono);font-size:9px;color:var(--acc2);margin-bottom:5px}
.tt-r{display:flex;justify-content:space-between;gap:12px;font-size:10px;color:var(--t3);margin-bottom:2px}
.tt-v{color:var(--t1);font-family:var(--mono)}
@media(max-width:768px){
  .sb{display:none}.dp{display:none}
  .mob-nav{display:flex}.bs{display:flex}
  .h-stats{display:none}.h-proj{display:none}
  .hb span:last-child{display:none}.hb{padding:0 10px}
  .zc{bottom:70px;right:14px}.leg{display:none}
}
@media(max-width:420px){.hb{width:32px;padding:0;justify-content:center}}

<script>
const TC={page:'#60a5fa',script:'#fbbf24',style:'#a78bfa',data:'#f87171',api:'#34d399',other:'#94a3b8'};
const TI={page:'📄',script:'⚙️',style:'🎨',data:'📋',api:'🌐',other:'📦'};
const EC={
  import:'rgba(251,191,36,.6)',require:'rgba(251,191,36,.6)',dynamic_import:'rgba(251,191,36,.3)',
  script_load:'rgba(167,139,250,.55)',stylesheet:'rgba(167,139,250,.22)',
  navigation:'rgba(96,165,250,.75)',api_call:'rgba(52,211,153,.75)',
  redirect:'rgba(248,113,113,.9)',form_submit:'rgba(251,146,60,.6)'
};
const NW=176,NH=50,NR=10,GPAD=30,GGAP=48,NGX=20,NGY=44;
const delay=ms=>new Promise(r=>setTimeout(r,ms));
let NODES=[],EDGES=[],GROUPS=[],RAW={};
let positions={},layout='group',sel=null,hov=null;
let filterType='all',searchQ='';
let tx=0,ty=0,sc=1,drag=false,ds={x:0,y:0};
const DPR=window.devicePixelRatio||1;
const mob=()=>window.innerWidth<=768;
const cvs=document.getElementById('cvs');
const ctx=cvs.getContext('2d');
const wrap=document.getElementById('cvWrap');
const ldBar=document.getElementById('ldBar');
const ldMsg=document.getElementById('ldMsg');
function prog(p,m){ldBar.style.width=p+'%';if(m)ldMsg.textContent=m;}
function loadData(){
  return new Promise((res,rej)=>{
    prog(25,'Loading data file…');
    const s=document.createElement('script');
    s.src='./archflow-data.js?t='+Date.now();
    s.onload=()=>window.__ARCHFLOW_DATA__?res(window.__ARCHFLOW_DATA__):rej(new Error('archflow-data.js: __ARCHFLOW_DATA__ not defined'));
    s.onerror=()=>rej(new Error('Cannot load archflow-data.js — serve via: npx serve .'));
    document.head.appendChild(s);
  });
}
async function init(){
  try{
    prog(10,'Starting up…');await delay(250);
    const data=await loadData();
    prog(70,'Processing…');await delay(80);
    RAW=data;NODES=Object.values(data.nodes||{});EDGES=data.edges||[];GROUPS=Object.values(data.groups||{});
    document.getElementById('hProj').textContent=data.meta?.project||'Project';
    document.getElementById('hStats').innerHTML=[
      {v:NODES.length,l:'nodes'},{v:EDGES.length,l:'edges'},
      {v:GROUPS.length,l:'groups'},{v:NODES.reduce((a,n)=>a+(n.info?.apis?.length||0),0),l:'apis'}
    ].map(s=>'<div class="h-s"><span class="h-s-v">'+s.v+'</span><span class="h-s-l">'+s.l+'</span></div>').join('');
    prog(85,'Building graph…');buildFilters();buildList();resize();setLayout('group');
    prog(100,'Ready!');await delay(380);
    document.getElementById('loader').classList.add('out');
    await delay(400);
    document.getElementById('app').classList.add('on');cvs.classList.add('on');
  }catch(err){ldMsg.textContent='Error: '+err.message;ldMsg.style.color='#f87171';console.error(err);}
}
function resize(){
  const W=wrap.clientWidth,H=wrap.clientHeight;
  cvs.width=W*DPR;cvs.height=H*DPR;cvs.style.width=W+'px';cvs.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);render();
}
window.addEventListener('resize',resize);
function computeGroup(){
  const pos={};const W=wrap.clientWidth;
  const sorted=[...GROUPS].sort((a,b)=>b.files.length-a.files.length);
  const cols=Math.max(2,Math.min(4,Math.ceil(Math.sqrt(sorted.length*1.4))));
  const colW=Math.max(360,W/cols);
  const meta=sorted.map((g,gi)=>{
    const files=g.files.filter(f=>RAW.nodes[f]);
    const npr=Math.max(1,Math.floor((colW-GPAD*2+NGX)/(NW+NGX)));
    const rows=Math.ceil(files.length/npr);
    const bW=GPAD*2+npr*(NW+NGX)-NGX,bH=GPAD*2+30+rows*(NH+NGY)-NGY;
    return{g,files,npr,bW,bH,col:gi%cols,row:Math.floor(gi/cols)};
  });
  const rowH={};
  meta.forEach(m=>{rowH[m.row]=Math.max(rowH[m.row]||0,m.bH);});
  const rowY={};let cy=60;
  Object.keys(rowH).sort((a,b)=>a-b).forEach(r=>{rowY[r]=cy;cy+=rowH[r]+GGAP;});

    const hdr=document.createElement('div');hdr.className='grp-h';
    hdr.innerHTML='<div class="grp-dot" style="background:'+g.color+'"></div>'
      +'<span class="grp-n">'+g.icon+' '+g.label+'</span>'
      +'<span class="grp-c">'+files.length+'</span>'
      +'<span class="grp-a'+(open?' o':'')+'">&#x203A;</span>';
    const fEl=document.createElement('div');fEl.className='grp-f'+(open?' o':'');
    const arr=hdr.querySelector('.grp-a');
    hdr.onclick=()=>{const o=fEl.classList.toggle('o');arr.classList.toggle('o',o);};
    files.forEach(fid=>{
      const n=RAW.nodes[fid];if(!n)return;const c=TC[n.type]||'#64748b';
      const item=document.createElement('div');item.className='fi'+(sel===fid?' sel':'');item.dataset.id=fid;
      item.innerHTML='<span style="font-size:11px">'+(TI[n.type]||'📦')+'</span>'
        +'<span class="fi-n" title="'+fid+'">'+n.name+'</span>'
        +'<span class="fi-e" style="background:'+c+'22;color:'+c+'">'+n.ext+'</span>';
      item.onclick=()=>{selectNode(fid);centerOn(fid);};fEl.appendChild(item);
    });
    div.appendChild(hdr);div.appendChild(fEl);list.appendChild(div);
  });
}
